[project]
name = "drone-delivery-system"
version = "0.1.0"
description = "A PyQt5 frontend with a FastAPI backend for a delivery system."
authors = [
    {name = "Keerthana430", email = "keerthanakrisuj@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
package-mode = false

# These are the CORE dependencies needed for your entire project to run.
dependencies = [
    # --- Backend Dependencies ---
    "fastapi",                   # The main web framework for your backend API
    "uvicorn[standard]",         # The server that runs your FastAPI application
    "libsql-client",             # The official driver to connect to your Turso/libSQL database
    "python-dotenv",             # For managing environment variables (like your database URL and token)

    # --- Frontend Dependencies ---
    "PyQt5",                     # The main GUI framework for your desktop application
    "requests",                  # The standard library for making HTTP requests from your frontend to your backend
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
