[project]
name = "drone-truck-delivery-system"
version = "0.1.0"
description = "Drone and Truck Delivery System with ALNS Optimization"
authors = [
    {name = "Keerthana430", email = "keerthanakrisuj@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
package-mode = false
dependencies = [
    "fastapi (==0.116.1)",
    "uvicorn (==0.35.0)",
    "pydantic (==2.11.7)",
    "starlette (==0.47.2)",
    "libsql-client (>=0.3.1,<0.4.0)",
    "python-dotenv (==1.0.1)",
    "aiohttp (>=3.12.15,<4.0.0)",
    "requests (==2.32.5)",
    "numpy (==2.2.4)",
    "pandas (==2.2.3)",
    "scipy (==1.15.2)",
    "scikit-learn (==1.6.1)",
    "matplotlib (==3.10.5)",
    "folium (==0.20.0)",
    "pyqt5 (==5.15.11)",
    "pyqt5-qt5 (==5.15.2)",
    "pyqt5-sip (==12.17.0)",
    "pyqtwebengine (==5.15.7)",
    "pyqtwebengine-qt5 (==5.15.2)",
    "pyqtgraph (==0.13.7)",
    "qasync (>=0.27.1,<0.28.0)",
    "typing-extensions (==4.12.2)",
    "pytz (==2025.1)",
    "python-dateutil (==2.9.0.post0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
